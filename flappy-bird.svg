<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes fly {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-30px); }
    }
    @keyframes movePipe {
      0% { transform: translateX(800px); }
      100% { transform: translateX(-100px); }
    }
    @keyframes moveGround {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-50px); }
    }
    .bird {
      animation: fly 1s ease-in-out infinite;
    }
    .pipe {
      animation: movePipe 5s linear infinite;
    }
    .ground-pattern {
      animation: moveGround 1s linear infinite;
    }
  </style>
  
  <!-- Sky background -->
  <rect width="800" height="400" fill="#4EC0CA"/>
  
  <!-- Clouds -->
  <ellipse cx="100" cy="60" rx="40" ry="20" fill="white" opacity="0.7"/>
  <ellipse cx="130" cy="60" rx="50" ry="25" fill="white" opacity="0.7"/>
  <ellipse cx="160" cy="60" rx="35" ry="18" fill="white" opacity="0.7"/>
  
  <ellipse cx="400" cy="80" rx="45" ry="22" fill="white" opacity="0.6"/>
  <ellipse cx="435" cy="80" rx="55" ry="28" fill="white" opacity="0.6"/>
  <ellipse cx="470" cy="80" rx="40" ry="20" fill="white" opacity="0.6"/>
  
  <ellipse cx="650" cy="50" rx="50" ry="25" fill="white" opacity="0.7"/>
  <ellipse cx="685" cy="50" rx="45" ry="22" fill="white" opacity="0.7"/>
  
  <!-- Pipes (animated) -->
  <g class="pipe">
    <rect x="600" y="0" width="60" height="120" fill="#5DBE4A" stroke="#4A9D3A" stroke-width="3"/>
    <rect x="595" y="115" width="70" height="20" fill="#4A9D3A"/>
    <rect x="600" y="280" width="60" height="120" fill="#5DBE4A" stroke="#4A9D3A" stroke-width="3"/>
    <rect x="595" y="265" width="70" height="20" fill="#4A9D3A"/>
  </g>
  
  <g class="pipe" style="animation-delay: -2.5s">
    <rect x="400" y="0" width="60" height="150" fill="#5DBE4A" stroke="#4A9D3A" stroke-width="3"/>
    <rect x="395" y="145" width="70" height="20" fill="#4A9D3A"/>
    <rect x="400" y="310" width="60" height="90" fill="#5DBE4A" stroke="#4A9D3A" stroke-width="3"/>
    <rect x="395" y="295" width="70" height="20" fill="#4A9D3A"/>
  </g>
  
  <!-- Bird (animated) -->
  <g class="bird" transform="translate(150, 180)">
    <!-- Body -->
    <circle cx="0" cy="0" r="15" fill="#FFD700"/>
    <circle cx="0" cy="0" r="15" fill="#FFA500" opacity="0.3"/>
    <!-- Wing -->
    <ellipse cx="-5" cy="5" rx="12" ry="8" fill="#FF8C00" transform="rotate(-20)"/>
    <!-- Eye -->
    <circle cx="5" cy="-3" r="3" fill="white"/>
    <circle cx="6" cy="-3" r="1.5" fill="black"/>
    <!-- Beak -->
    <polygon points="12,-2 20,0 12,2" fill="#FF6347"/>
  </g>
  
  <!-- Ground -->
  <rect x="0" y="350" width="800" height="50" fill="#DEB887"/>
  <g class="ground-pattern">
    <rect x="0" y="350" width="50" height="10" fill="#D2691E"/>
    <rect x="50" y="350" width="50" height="10" fill="#CD853F"/>
    <rect x="100" y="350" width="50" height="10" fill="#D2691E"/>
    <rect x="150" y="350" width="50" height="10" fill="#CD853F"/>
    <rect x="200" y="350" width="50" height="10" fill="#D2691E"/>
    <rect x="250" y="350" width="50" height="10" fill="#CD853F"/>
    <rect x="300" y="350" width="50" height="10" fill="#D2691E"/>
    <rect x="350" y="350" width="50" height="10" fill="#CD853F"/>
    <rect x="400" y="350" width="50" height="10" fill="#D2691E"/>
    <rect x="450" y="350" width="50" height="10" fill="#CD853F"/>
    <rect x="500" y="350" width="50" height="10" fill="#D2691E"/>
    <rect x="550" y="350" width="50" height="10" fill="#CD853F"/>
    <rect x="600" y="350" width="50" height="10" fill="#D2691E"/>
    <rect x="650" y="350" width="50" height="10" fill="#CD853F"/>
    <rect x="700" y="350" width="50" height="10" fill="#D2691E"/>
    <rect x="750" y="350" width="50" height="10" fill="#CD853F"/>
  </g>
  
  <!-- Score display -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="white" text-anchor="middle" stroke="black" stroke-width="2">Flappy Bird Game!</text>
  
  <!-- Instructions -->
  <text x="400" y="370" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">🎮 Animated Flappy Bird in SVG 🎮</text>
</svg>
